<text x="20" y="33" >バスト 820 mm ／ 背丈 375 mm ／ 袖丈 520 mm</text>
<text x="20" y="44" class="muted">縫い線・実寸 1:1 ／ 縫い代なし ／ ダーツあり ／ カーブは数値近似</text>
