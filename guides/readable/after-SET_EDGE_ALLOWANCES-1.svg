<text x="20" y="20" font-weight="700" style="font-size:10px">旧文化式・婦人原型（ダーツなし）</text>
<text x="20" y="33" >バスト 820 mm ／ 背丈 375 mm ／ 袖丈 520 mm</text>
<text x="20" y="44" class="muted">縫い線・実寸 1:1 ／ 縫い代あり（赤破線＝裁断線） ／ ダーツなし ／ カーブは数値近似</text>
<text x="20" y="55" class="muted">原型の試作です。着用確認・補正後に、ダーツや開きなどの縫製設計を行ってください。</text>
